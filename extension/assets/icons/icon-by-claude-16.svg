  <!-- Horizontal scan lines (pixel-aligned) -->
  <line 
    x1="5" 
    y1="7" 
    x2="11" 
    y2="7" 
    stroke="#93c5fd" 
    stroke-width="1.5" 
    opacity="0.9"
  />
  
  <line 
    x1="5" 
